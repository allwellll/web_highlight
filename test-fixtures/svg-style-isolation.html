<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>SVG Style Isolation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    main {
      margin: 0 auto;
      max-width: 900px;
      padding: 18px 28px 40px;
    }
    header {
      background: linear-gradient(135deg, #ffffff, #eaf4ff);
      border: 1px solid #cfe2f5;
      border-radius: 16px;
      padding: 22px;
    }
    svg {
      background: #f8fafc;
      border: 1px solid #edf1f7;
      border-radius: 8px;
      height: 110px;
      margin-top: 6px;
      width: 100%;
    }
    output {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 24px;
      white-space: pre-wrap;
    }
  </style>
  <link rel="stylesheet" href="../src/content/content.css?svg-isolation=3">
</head>
<body>
  <main>
    <header>
      <h1>全量训练对比：GSPO vs Positive BC + 弱 GSPO</h1>
      <p>验证页面全局 SVG 样式不会污染插件画笔层。</p>
    </header>
    <output id="result"></output>
  </main>
  <script>
    window.__whlStore = {};
    window.chrome = {
      storage: {
        local: {
          async get(key) {
            if (key == null) return { ...window.__whlStore };
            if (typeof key === "string") return { [key]: window.__whlStore[key] };
            return {};
          },
          async set(value) {
            Object.assign(window.__whlStore, value);
          },
          async remove(keys) {
            for (const key of Array.isArray(keys) ? keys : [keys]) delete window.__whlStore[key];
          }
        }
      },
      runtime: {
        onMessage: {
          addListener(listener) {
            window.__whlListener = listener;
          }
        },
        sendMessage(message, callback) {
          if (message.type === "WHL_LOAD_REMOTE") callback?.({ ok: true, payload: null });
          if (message.type === "WHL_SAVE_REMOTE") callback?.({ ok: true, queued: true });
          return Promise.resolve();
        }
      }
    };
  </script>
  <script src="../src/content/content.js?svg-isolation=4"></script>
  <script>
    window.__whlListener({
      type: "WHL_SET_MODE",
      state: {
        mode: "highlight",
        floatingColorPanelEnabled: true,
        highlightColor: "#f0d86a",
        highlightPalette: ["#f0d86a", "#7cff7c", "#74c0fc", "#ffadad", "#d0bfff", "#ffd43b"]
      }
    }, null, () => {});

    setTimeout(() => {
      const textNode = document.querySelector("h1").firstChild;
      const range = document.createRange();
      range.setStart(textNode, 0);
      range.setEnd(textNode, 8);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      document.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));

      const layer = document.querySelector(".whl-pen-layer");
      const layerRect = layer.getBoundingClientRect();
      const layerStyle = getComputedStyle(layer);
      const expandButton = document.querySelector(".whl-color-expand-btn");
      const expandIcon = expandButton?.querySelector("svg");
      const buttonRect = expandButton?.getBoundingClientRect();
      const iconRect = expandIcon?.getBoundingClientRect();
      const iconStyle = expandIcon ? getComputedStyle(expandIcon) : null;
      document.querySelector("#result").textContent = JSON.stringify({
        penLayer: {
          transparent: layerStyle.backgroundColor === "rgba(0, 0, 0, 0)",
          borderless: layerStyle.borderTopWidth === "0px",
          marginless: layerStyle.marginTop === "0px",
          fillsDocument: Math.round(layerRect.height) >= document.documentElement.scrollHeight
        },
        expandButton: {
          iconContained: Boolean(iconRect && buttonRect && iconRect.height <= 16 && iconRect.width <= 16 && iconRect.bottom <= buttonRect.bottom),
          buttonRect: buttonRect && {
            width: Math.round(buttonRect.width),
            height: Math.round(buttonRect.height)
          },
          iconRect: iconRect && {
            width: Math.round(iconRect.width),
            height: Math.round(iconRect.height)
          },
          iconStyle: iconStyle && {
            backgroundColor: iconStyle.backgroundColor,
            borderTopWidth: iconStyle.borderTopWidth,
            marginTop: iconStyle.marginTop
          }
        }
      }, null, 2);
    }, 200);
  </script>
</body>
</html>
